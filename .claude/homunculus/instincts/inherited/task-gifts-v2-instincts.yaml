# Commits sao Conventional Commits, cobrados por hook

## Action

Use `<tipo>(<escopo>): <assunto>` em PT-BR, assunto com >= 10 caracteres e sem ponto final.
Tipos aceitos: feat fix docs style refactor perf test build ci chore security revert.

## Evidence

- `scripts/ci/commit-msg-lint.mjs` (lista `TIPOS`, `SUBJECT_MIN_LENGTH = 10`)
- `.husky/commit-msg` chama o lint
- `AGENTS.md` > Fluxo Git

