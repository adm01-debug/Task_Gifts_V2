# Repositorio publico e secret scanning desligado

## Action

Nenhum segredo em arquivo versionado — nao ha alerta automatico que pegue o erro. Segredo de edge
vai em `supabase secrets set`; var de front com prefixo `VITE_` e publica por construcao.

## Evidence

- `github_get_repo`: `visibility: public`, `secret_scanning: disabled` (medido 2026-11-08)
- `PENDENCIAS.md` P-001 (conversao para publico em 2026-10-29)
- `docs/agentes/banco.md` > "Segredo exposto"

