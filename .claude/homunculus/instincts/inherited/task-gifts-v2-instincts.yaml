# `bun run typecheck` nao verifica nada

## Action

Rode `npx tsc --noEmit -p tsconfig.app.json` (ou `npx tsc -b`). Nunca cite `bun run typecheck`
como prova de tipo correto.

## Evidence

- `tsconfig.json` tem `"files": []` + `"references"`; `tsc --noEmit` sem `-b` nao segue references
- `package.json` > scripts.typecheck = `tsc --noEmit`

