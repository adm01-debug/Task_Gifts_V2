## Action

Banco em uso: `eidsaqymojyuhprobfpn` (o que o app le em `VITE_SUPABASE_URL`). `supabase/config.toml`
declara `awzhgfmqwddzgbqzqusc`, outro projeto. Nao existe ledger de migrations: confirme o estado
real por introspecao e escreva migration idempotente.

## Evidence

- `supabase/config.toml:1` vs `src/integrations/supabase/client.ts:5`
- ausencia de `supabase_migrations.schema_migrations`
