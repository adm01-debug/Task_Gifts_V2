`verify_jwt` do `supabase/config.toml` (so `migrate-helper` esta aberto), e se a funcao foi
realmente deployada (nao existe workflow de deploy).

## Evidence

- `src/lib/edgeAvailability.ts:35` e `src/lib/requestId.ts:128`
- `supabase/config.toml`
- `docs/agentes/edge-functions.md`

