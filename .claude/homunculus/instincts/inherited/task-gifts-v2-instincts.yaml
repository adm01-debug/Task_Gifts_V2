# Merge em `main` publica em producao

## Action

O Vercel faz deploy automatico no push da `main`. Depois do merge, confirme `latestDeployment`
(`readyState: READY`, `target: production`) e reporte. Deixe a PR aberta e chame o dono quando
envolver CI/workflows, segredos, branch protection, DDL de producao, delecao de dado ou custo.

## Evidence

- `mcp__Vercel__get_project` (projeto `task-gifts-v2`, team `juca1`)
- `docs/agentes/vercel-deploy.md`
- `AGENTS.md` > Fluxo Git
