name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Em PRs do Dependabot, secrets não estão disponíveis por política do GitHub.
      # Usamos fallback com URL/chave de placeholder válidos para que o Vite
      # compile e o app renderize; o E2E Gate só verifica rotas públicas/guardas,
      # não faz chamadas reais ao Supabase.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

      - name: Unit Tests
        run: bun run test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: bun playwright install --with-deps chromium

      - name: E2E Gate (rotas publicas e guardas de auth)
        run: bun playwright test tests/e2e/smoke.spec.ts tests/auth-flow.spec.ts

      - name: E2E Nao-Bloqueante (happy paths exigem conta de teste dedicada)
        run: bun playwright test tests/e2e/happy-paths.spec.ts
        continue-on-error: true

      - name: Generate Audit PDF
        run: |
          cat << 'EOF' > md-to-pdf.config.js
          module.exports = {
            launch_options: {
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            },
          };
          EOF
          npx md-to-pdf audit_report.md
        continue-on-error: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            audit_report.pdf
            playwright-report/
