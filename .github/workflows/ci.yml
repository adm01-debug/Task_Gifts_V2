name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Em PRs do Dependabot, secrets não estão disponíveis por política do GitHub.
      # Usamos fallback com URL/chave de placeholder válidos para que o Vite
      # compile e o app renderize; o E2E Gate só verifica rotas públicas/guardas,
      # não faz chamadas reais ao Supabase.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder' }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security Audit
        # Falha apenas em vulnerabilidades de runtime (high/critical).
        # DevDeps como eslint/storybook com CVEs transitivas de build não bloqueiam
        # (documentado em RELATORIO_CI.md §4). Usar --omit=dev quando suportado.
        run: |
          bun audit --audit-level=high 2>&1 | tee /tmp/audit_out.txt || true
          if grep -qE '^(critical|high)' /tmp/audit_out.txt 2>/dev/null; then
            echo "::error::Vulnerabilidade HIGH/CRITICAL encontrada em dependências de RUNTIME"
            cat /tmp/audit_out.txt
            exit 1
          fi
          echo "Audit OK — nenhuma vulnerabilidade high/critical em runtime."
        continue-on-error: false

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

      - name: Unit Tests com Coverage
        run: bun run test:ci
        env:
          CI: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-v1
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: bun playwright install --with-deps chromium

      - name: E2E Gate (rotas publicas e guardas de auth)
        run: bun playwright test tests/e2e/smoke.spec.ts tests/auth-flow.spec.ts

      - name: E2E Nao-Bloqueante (happy paths exigem conta de teste dedicada)
        run: bun playwright test tests/e2e/happy-paths.spec.ts
        continue-on-error: true

      - name: Generate Audit PDF
        run: |
          cat << 'EOF' > md-to-pdf.config.js
          module.exports = {
            launch_options: {
              args: ['--no-sandbox', '--disable-setuid-sandbox'],
            },
          };
          EOF
          npx md-to-pdf audit_report.md
        continue-on-error: true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts
          path: |
            audit_report.pdf
            playwright-report/
            coverage/

