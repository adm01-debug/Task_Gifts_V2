 name: CI
 
 on:
   push:
     branches: [ main, master ]
   pull_request:
     branches: [ main, master ]
 
 jobs:
   quality:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: oven-sh/setup-bun@v1
 
       - name: Install dependencies
         run: bun install
 
       - name: Lint
         run: bun run lint
 
       - name: Type Check
         run: bun run typecheck
 
        - name: Unit Tests
          run: bun run test

        - name: Install Playwright Browsers
          run: bun playwright install --with-deps chromium

        - name: E2E Tests
          run: bun playwright test

        - name: Generate Audit PDF
          run: |
            cat << 'EOF' > md-to-pdf.config.js
            module.exports = {
              launch_options: {
                args: ['--no-sandbox', '--disable-setuid-sandbox'],
              },
            };
            EOF
            npx md-to-pdf audit_report.md

        - name: Upload Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: ci-artifacts
            path: |
              audit_report.pdf
              playwright-report/
