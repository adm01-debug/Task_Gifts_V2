 name: CI
 
 on:
   push:
     branches: [ main, master ]
   pull_request:
     branches: [ main, master ]
 
 jobs:
   quality:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: oven-sh/setup-bun@v1
 
       - name: Install dependencies
         run: bun install
 
       - name: Lint
         run: bun run lint
 
       - name: Type Check
         run: bun run typecheck
 
       - name: Test
         run: bun run test