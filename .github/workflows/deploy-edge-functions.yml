name: Deploy Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions a deployar (vazio = todas; separar por virgula, ex.: verify-ip,ai-coach)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: eidsaqymojyuhprobfpn
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validar secret SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN nao definido nos secrets. Adicione um PAT https://supabase.com/dashboard/account/tokens com scope em eidsaqymojyuhprobfpn."
            exit 1
          fi

      - name: Deploy edge functions
        env:
          # Nunca interpolar `inputs.functions` direto no shell: o texto do
          # disparo viraria comando no runner, que tem o PAT do Supabase no
          # ambiente. Vai por env e passa por validacao antes de virar argumento.
          FUNCS_INPUT: ${{ inputs.functions }}
        run: |
          set -uo pipefail
          if [ -n "$(printf '%s' "$FUNCS_INPUT" | tr -d '[:space:]')" ]; then
            if ! printf '%s' "$FUNCS_INPUT" | grep -Eq '^[[:space:]]*[a-z0-9][a-z0-9_-]*([[:space:]]*,[[:space:]]*[a-z0-9][a-z0-9_-]*)*[[:space:]]*$'; then
              echo "::error::inputs.functions invalido: use nomes de function em minusculas (letras, numeros, hifen), separados por virgula."
              exit 1
            fi
            IFS=',' read -ra FUNCS <<< "$FUNCS_INPUT"
            for fn in "${FUNCS[@]}"; do
              fn="$(printf '%s' "$fn" | tr -d '[:space:]')"
              echo "> deploy $fn"
              supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID" --yes
            done
          else
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --yes
          fi