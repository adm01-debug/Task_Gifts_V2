# Aplica em producao as migrations de supabase/migrations/ que faltam no ledger.
#
# Por que existe: nenhum workflow deste repositorio aplicava migration - a
# 20261229000000 (janela de silencio) entrou em producao por uma branch
# descartavel. Sem isto, aplicar migration depende de trabalho manual e o
# rebuild/reset reconstroi o schema sem o que ficou fora do ledger.
#
# Nunca roda sozinho: `workflow_dispatch` com escolha explicita entre relatar
# (check) e escrever (apply). DDL em producao exige decisao humana.
name: Migrations do banco

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check = so relata (nao escreve); apply = aplica o que falta; consulta = roda a consulta escolhida"
        required: true
        default: check
        type: choice
        options:
          - check
          - apply
          - consulta
      sql:
        description: "modo consulta: nome da consulta em scripts/db-audit/consultas.sql"
        required: false
        default: ""
        type: string
      verify:
        description: "opcional: objeto (tabela/view) que deve existir no banco depois do apply"
        required: false
        default: ""
        type: string
      reaplicar:
        description: "opcional: versao (ex 20261231100000) de uma migration JA registrada no ledger que precisa rodar de novo - use quando o arquivo foi corrigido com CREATE OR REPLACE"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: migrations-do-banco
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: eidsaqymojyuhprobfpn
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Conferir e aplicar migrations pendentes
        env:
          # Nunca interpolar input direto no shell: vai por env e passa por validacao.
          MIGRATION_MODE: ${{ inputs.mode }}
          VERIFY_OBJECT: ${{ inputs.verify }}
          SELECAO_SQL: ${{ inputs.sql }}
          REAPLICAR_VERSAO: ${{ inputs.reaplicar }}
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN ausente nos secrets. Use um PAT https://supabase.com/dashboard/account/tokens com acesso a eidsaqymojyuhprobfpn."
            exit 1
          fi
          # modo consulta: le so o SELECT escolhido numa lista fechada; nada de SQL digitado livre.
          if [ "${MIGRATION_MODE}" = "consulta" ]; then
            if [ -z "${SELECAO_SQL:-}" ]; then
              echo "::error::modo consulta exige o input sql (uma das consultas do scripts/db-audit/consultas.sql)"
              exit 1
            fi
            SQL_FILE=scripts/db-audit/consultas.sql SELECAO_SQL="${SELECAO_SQL}" node scripts/db-audit/consultar-sql.mjs
            exit $?
          fi
          case "${MIGRATION_MODE}" in
            check) ARGS="" ;;
            apply) ARGS="--apply" ;;
            *) echo "::error::modo invalido: '${MIGRATION_MODE}' (use check ou apply)"; exit 1 ;;
          esac
          # O nome do objeto vai por --verify=, nunca virando palavra solta no shell.
          if [ -n "${REAPLICAR_VERSAO:-}" ]; then
            if ! printf '%s' "${REAPLICAR_VERSAO}" | grep -Eq '^[0-9]{14}$'; then
              echo "::error::input reaplicar deve ser a versao de 14 digitos (ex 20261231100000)"
              exit 1
            fi
            if ! ls "supabase/migrations/${REAPLICAR_VERSAO}"*.sql >/dev/null 2>&1; then
              echo "::error::nao ha arquivo supabase/migrations/${REAPLICAR_VERSAO}*.sql no repo"
              exit 1
            fi
            echo "reaplicando a versao ${REAPLICAR_VERSAO} (ja registrada no ledger)"
            ARGS="$ARGS --reaplicar=${REAPLICAR_VERSAO}"
          fi
          if [ -n "${VERIFY_OBJECT:-}" ]; then
            node scripts/db-audit/apply-migrations.mjs $ARGS --verify="$VERIFY_OBJECT"
          else
            node scripts/db-audit/apply-migrations.mjs $ARGS
          fi